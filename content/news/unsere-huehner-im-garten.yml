intro: >-
  Seit diesem Frühjahr leben bei uns im Garten vier neue
  Mitbewohnerinnen: die Hennen Emma, Ida, Rosi und Thea. Sie waren
  zunächst noch richtig jung, inzwischen haben sie sich gut
  eingelebt und sorgen für ordentlich Leben im Auslauf.
content: >-
  Anfangs gehörte auch Hahn Theo zu unserer kleinen Herde. Er hielt
  die Rangordnung im Stall zusammen und warnte die Hennen bei
  Gefahr, wurde dabei aber zunehmend protektiv gegenüber Menschen,
  die sich dem Stall näherten. Das ließ sich mit einem Gästebetrieb
  nicht vereinbaren, deshalb musste er inzwischen ausziehen. Die
  vier Hennen kommen seitdem gut zurecht, zumal Hennen für das
  Eierlegen ohnehin keinen Hahn brauchen.

  Emma, Ida, Rosi und Thea erkunden den Auslauf meist gemeinsam als
  Gruppe und folgen einander von einer Ecke zur nächsten.

  Vor etwa vier Wochen haben unsere Hennen die ersten Eier gelegt.
  Das passt gut zusammen. Hühner werden je nach Rasse mit etwa 20
  bis 24 Lebenswochen legereif, und unsere vier sind seit diesem
  Frühjahr bei uns aufgewachsen.

  Die Bildung eines Eis im Körper der Henne dauert ungefähr 24 bis
  26 Stunden. Deshalb legt eine Henne nicht an jedem Tag ein Ei,
  sondern meist im Abstand von etwas mehr als einem Tag.

  Die braune Farbe der Schale entsteht übrigens erst kurz vor dem
  Legen. Ein Farbstoff namens Protoporphyrin wird in den letzten
  Stunden auf die fertige Schale aufgetragen, vorher ist sie noch
  weiß.

  Inzwischen legen Emma, Ida, Rosi und Thea zuverlässig genug Eier,
  dass wir sie auch unseren Gästen zum Frühstück anbieten können.
  Wer bei uns übernachtet, kann die Eier probieren, direkt aus dem
  eigenen Garten und ohne langen Transportweg.

  Ein einfacher Trick zeigt übrigens, wie frisch ein Ei wirklich
  ist. Legt man es in ein Glas Wasser, sinkt ein frisches Ei auf den
  Boden. Ältere Eier haben eine größere Luftkammer und richten sich
  im Wasser eher auf oder schwimmen sogar.

  Wenn Sie bei uns zu Gast sind, schauen Sie gern im Hühnerauslauf
  vorbei. Emma, Ida, Rosi und Thea freuen sich über Besuch.
