faq:
  - question: 'Ab wann legen Hühner Eier?'
    answer: >-
      Hühner werden je nach Rasse mit etwa 20 bis 24 Lebenswochen
      legereif. Unsere Hennen Emma, Ida, Rosi und Thea sind seit
      diesem Frühjahr bei uns und haben vor etwa vier Wochen mit dem
      Legen begonnen.
  - question: 'Braucht eine Henne einen Hahn, um Eier zu legen?'
    answer: >-
      Nein. Hennen legen auch ohne Hahn regelmäßig Eier, diese sind
      dann nur unbefruchtet. Unser Hahn Theo hält vor allem die
      Rangordnung im Stall zusammen und warnt die Hennen bei Gefahr.
  - question: 'Wie erkennt man, ob ein Ei frisch ist?'
    answer: >-
      Ein einfacher Test hilft. Legt man das Ei in ein Glas Wasser,
      sinkt ein frisches Ei auf den Boden. Ältere Eier haben eine
      größere Luftkammer und richten sich im Wasser eher auf oder
      schwimmen.
