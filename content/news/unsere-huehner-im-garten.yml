seoTitle: 'Unsere Hühner im Garten: frische Eier für unsere Gäste'
seoDescription: >-
  Seit dem Frühjahr leben die Hennen Emma, Ida, Rosi und Thea bei
  uns im Garten. Inzwischen legen sie genug Eier für unsere Gäste
  zum Frühstück.
