title: 'Theo, Emma, Ida, Rosi und Thea: unsere Hühner im Garten'
slug: unsere-huehner-im-garten
seoTitle: 'Unsere Hühner im Garten: frische Eier für unsere Gäste'
seoDescription: >-
  Seit dem Frühjahr leben Hahn Theo und seine vier Hennen bei uns im
  Garten. Seit einigen Wochen legen sie genug Eier für unsere Gäste
  zum Frühstück.
