seoTitle: 'Wir.Sind.Tier. Festival 2026 in Worbis'
seoDescription: >-
  Am 27. und 28. Juni 2026 fand im Bärenpark Worbis das Wir.Sind.Tier.
  Festival statt. Der Park liegt nur 6 km von der Pension Volgenandt.
