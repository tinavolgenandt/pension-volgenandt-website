intro: >-
  Wenn draußen die Tage kürzer und kälter werden, gibt es kaum etwas
  Schöneres als echte, trockene Wärme. Deshalb lassen wir Ende
  November für unsere Gäste ein Saunafass im Garten aufbauen. Den genauen Termin verraten wir
  Ihnen hier, sobald er feststeht.
content: >-
  Warum ausgerechnet ein Fass? Die runde Bauform hat einen
  praktischen Grund. Im Vergleich zu einer eckigen Kabine mit
  ähnlicher Sitzfläche gibt es weniger ungenutzten Raum in den Ecken
  und unter der Decke. Das Fass umschließt nur rund 4,1 Kubikmeter
  Luft. Je kleiner dieses Volumen ist, desto schneller und mit desto
  weniger Energie wird es drinnen gemütlich warm. Die gewölbten
  Wände lenken die aufsteigende Luft außerdem gleichmäßig zurück
  nach unten, sodass sich die Wärme angenehm im ganzen Raum verteilt.

  Was passiert beim Saunieren im Körper? Bei 80 bis 90 Grad
  Lufttemperatur steigt die Hauttemperatur innerhalb weniger
  Minuten deutlich an, die Körperkerntemperatur um etwa ein Grad.
  Die Blutgefäße in der Haut weiten sich, das Herz schlägt schneller
  und pumpt mehr Blut. Für den Kreislauf ähnelt das einer leichten
  bis mittleren körperlichen Belastung, während Sie selbst einfach
  entspannt auf der Holzbank sitzen.

  Danach kommt der erfrischende Teil. Beim Abkühlen ziehen sich die
  Gefäße wieder zusammen. Dafür steht im Garten eine Gartendusche
  bereit, und anschließend können Sie in Ruhe die frische Luft
  genießen und durchatmen. Dieser Wechsel aus Wärme und Kälte
  trainiert die Anpassungsfähigkeit der Blutgefäße. Viele Menschen
  fühlen sich danach angenehm müde und schlafen besonders gut.

  Auch die Forschung beschäftigt sich damit. Eine finnische
  Langzeitstudie mit rund 2.300 Männern, die über etwa 20 Jahre
  begleitet wurden, kam zu einem deutlichen Ergebnis. Männer, die
  vier- bis siebenmal pro Woche in die Sauna gingen, starben seltener
  an Herz-Kreislauf-Erkrankungen als Männer, die nur einmal pro Woche
  saunierten. Solche Beobachtungsstudien zeigen einen Zusammenhang,
  beweisen aber noch keine Ursache. Wer Herz- oder Kreislaufprobleme
  hat, sollte vorher ärztlichen Rat einholen.

  Frauen waren an dieser Studie nicht beteiligt. Belastbare Daten
  dazu, wie sich regelmäßiges Saunieren auf die Gesundheit von
  Frauen auswirkt, gibt es bisher kaum. Das ist leider nichts Neues,
  denn in der medizinischen Forschung werden Frauen seit Jahrzehnten
  deutlich seltener untersucht als Männer.

  Beheizt wird das Saunafass mit einem Elektroofen, und hier kommt
  unsere Photovoltaikanlage ins Spiel. Den Strom, den sie auf dem
  Dach erzeugt, nutzen wir so weit wie möglich direkt im Haus. Ein
  Saunaofen braucht während des Aufheizens viel Leistung auf einmal.
  Wenn die Sonne scheint, kommt die Wärme in der Sauna also zu einem
  großen Teil direkt von unserem eigenen Dach.

  Ehrlicherweise gehört dazu auch: Im Winter erzeugt eine
  Solaranlage in Deutschland nur einen Bruchteil der Sommermenge,
  weil die Sonne tief steht und die Tage kurz sind. An trüben
  Wintertagen wird die Sauna daher auch Netzstrom brauchen. Umso
  mehr hilft die kompakte Bauform, denn jede Kilowattstunde, die
  gar nicht erst benötigt wird, ist die sauberste.

  Die Sauna ist nicht nur für unsere Übernachtungsgäste da. Auch
  Gäste von außerhalb sind herzlich willkommen. Ob nach einer
  Wanderung durchs Eichsfeld oder einfach als kleine Auszeit am
  Wochenende, melden Sie sich gern bei uns.

  Sobald der Aufbautermin feststeht, erfahren Sie es hier in unseren
  Neuigkeiten. Wir freuen uns auf Ihren Besuch.
facts:
  - 'Für Übernachtungsgäste ist die Sauna kostenlos.'
  - 'Gäste von außerhalb: 29 € für 2 Stunden.'
  - 'Der Preis gilt für die ganze Sauna, nicht pro Person.'
