intro: >-
  Wenn draußen die Tage kürzer und kälter werden, gibt es kaum etwas
  Schöneres als echte, wohlige Wärme. Deshalb lassen wir Ende November für
  unsere Gäste ein Saunafass im Garten aufbauen. Den genauen Eröffnungstermin
  verraten wir Ihnen hier, sobald er feststeht.
content: >-
  Warum ausgerechnet ein Fass? Die runde Bauform hat einen praktischen Grund.
  Im Vergleich zu einer eckigen Kabine mit ähnlicher Sitzfläche gibt es
  weniger ungenutzten Raum in den Ecken und unter der Decke. Das Fass
  umschließt nur rund 4,1 Kubikmeter Luft. Je kleiner dieses Volumen ist,
  desto schneller und mit desto weniger Energie wird es drinnen gemütlich warm.
  Die gewölbten Wände lenken die aufsteigende Luft außerdem gleichmäßig zurück
  nach unten, sodass sich die Wärme angenehm im ganzen Raum verteilt.

  Was passiert beim Saunieren im Körper? Bei 80 bis 90 Grad Lufttemperatur
  steigt die Hauttemperatur innerhalb weniger Minuten deutlich an, die
  Körperkerntemperatur um etwa ein Grad. Die Blutgefäße in der Haut weiten sich,
  das Herz schlägt schneller und pumpt mehr Blut. Für den Kreislauf ähnelt
  das einer leichten bis mittleren körperlichen Belastung, während Sie selbst
  einfach entspannt auf der Holzbank sitzen.

  Danach kommt der erfrischende Teil. Beim Abkühlen ziehen sich die Gefäße
  wieder zusammen. Dafür steht im Garten eine Gartendusche bereit, und
  anschließend können Sie in Ruhe die frische Luft genießen und durchatmen.
  Dieser Wechsel aus Wärme und Kälte trainiert die Anpassungsfähigkeit der
  Blutgefäße. Viele Menschen fühlen sich danach angenehm müde und schlafen
  besonders gut.

  Auch die Forschung beschäftigt sich damit. Eine finnische Langzeitstudie mit
  rund 2.300 Männern, die über etwa 20 Jahre begleitet wurden, kam zu einem
  deutlichen Ergebnis. Männer, die vier- bis siebenmal pro Woche in die Sauna
  gingen, starben seltener an Herz-Kreislauf-Erkrankungen als Männer, die nur
  einmal pro Woche saunierten. Solche Beobachtungsstudien zeigen einen
  Zusammenhang, beweisen aber noch keine Ursache. Wer Herz- oder
  Kreislaufprobleme hat, sollte vorher ärztlichen Rat einholen.

  Frauen waren an dieser Studie nicht beteiligt. Belastbare Daten dazu, wie
  sich regelmäßiges Saunieren auf die Gesundheit von Frauen auswirkt, gibt es
  bisher kaum. Das ist leider nichts Neues, denn in der medizinischen Forschung
  werden Frauen seit Jahrzehnten deutlich seltener untersucht als Männer.

  Beheizt wird das Saunafass mit einem Elektroofen, und hier kommt unsere
  Photovoltaikanlage ins Spiel. Den Strom, den sie auf dem Dach erzeugt,
  nutzen wir so weit wie möglich direkt im Haus. Ein Saunaofen braucht während
  des Aufheizens viel Leistung auf einmal. Wenn die Sonne scheint, kommt die
  Wärme in der Sauna also zu einem großen Teil direkt von unserem eigenen Dach.

  Ehrlicherweise gehört dazu auch: Im Winter erzeugt eine Solaranlage in
  Deutschland nur einen Bruchteil der Sommermenge, weil die Sonne tief steht
  und die Tage kurz sind. An trüben Wintertagen wird die Sauna daher auch
  Netzstrom brauchen. Umso mehr hilft die kompakte Bauform, denn jede
  Kilowattstunde, die gar nicht erst benötigt wird, ist die sauberste.

  Die Sauna ist nicht nur für unsere Übernachtungsgäste da. Auch externe
  Gäste aus dem Eichsfeld und Umgebung sind herzlich willkommen. Ob als
  private Auszeit zu zweit (Private Spa), zur Muskelentspannung nach einer
  Wanderung oder Radtour oder einfach als kleiner Kurzurlaub am Wochenende: Bei
  uns saunieren Sie ganz privat im Grünen ohne Trubel. Für Hausgäste ist die
  Nutzung im Aufenthalt inbegriffen; Gäste von außerhalb buchen das gesamte
  Saunafass für faire 29 € für 2 Stunden exklusiv für sich.

  Hinweis zum Bild: Die Abbildung des Saunafasses ist eine KI-generierte
  Visualisierung unseres geplanten Gartensauna-Projekts.

  Sobald der finale Aufbautermin feststeht, erfahren Sie es hier in unseren
  Neuigkeiten. Wir freuen uns auf Ihren Besuch.
facts:
  - 'Für Übernachtungsgäste ist die Sauna kostenlos im Aufenthalt enthalten.'
  - 'Gäste von außerhalb: 29 € für 2 Stunden – Pauschalpreis für das ganze Saunafass (nicht pro Person).'
  - 'Private Nutzung: Exklusiv reservierbar für 2 bis 4 Personen – ganz ohne fremde Gäste.'
  - 'Klassische finnische Wärme (80–90 °C) und erfrischende Gartendusche an reiner Eichsfelder Landluft.'
  - 'Nachhaltig: Beheizt mit eigenem Solarstrom von der Photovoltaikanlage auf dem Dach.'
faq:
  - question: 'Kann man das Saunafass auch als Tagesgast ohne Übernachtung nutzen?'
    answer: 'Ja! Unser Saunafass im Garten steht auch Gästen von außerhalb offen. Der Festpreis liegt bei fairen 29 € für 2 Stunden für das gesamte Saunafass (nicht pro Person). Eine Vorabreservierung ist erforderlich, damit wir die Sauna rechtzeitig für Sie vorheizen können.'
  - question: 'Ist die Sauna für Hausgäste der Pension Volgenandt kostenlos?'
    answer: 'Ja, für alle Übernachtungsgäste unserer Pension ist die Nutzung des Saunafasses kostenlos im Zimmerpreis inbegriffen. Zeitfenster für Ihre ungestörte Privatsphäre können flexibel vor Ort oder vorab reserviert werden.'
  - question: 'Wie viele Personen passen in das Saunafass?'
    answer: 'Das Saunafass bietet auf zwei gegenüberliegenden Holzbänken komfortabel Platz für 2 bis 4 Personen – perfekt für Paare, Freunde oder kleine Familien, die eine private Wellness-Auszeit im Grünen suchen.'
  - question: 'Wie wird das Saunafass beheizt und wie heiß wird es?'
    answer: 'Das Fass wird mit einem elektrischen Saunaofen auf klassische finnische 80 bis 90 °C erhitzt. An sonnigen Tagen stammt die Energie direkt aus unserer hauseigenen Photovoltaikanlage auf dem Dach.'
  - question: 'Wie kühlt man sich nach dem Saunagang ab?'
    answer: 'Im Naturgarten steht direkt neben dem Saunafass eine erfrischende Außendusche mit Kaltwasser bereit. Zudem können Sie auf Ruheliegen an der frischen Eichsfelder Landluft entspannen und durchatmen.'
  - question: 'Ab wann ist das Saunafass betriebsbereit?'
    answer: 'Der Aufbau des Saunafasses ist für Ende November 2026 geplant. Sobald der Eröffnungstermin feststeht, geben wir ihn hier bekannt. Reservierungsanfragen nehmen wir bereits jetzt gern telefonisch oder per E-Mail entgegen.'
  - question: 'Für wen ist das Saunafass im Eichsfeld besonders geeignet?'
    answer: 'Das Angebot richtet sich an Natur- und Aktivurlauber nach Wanderungen oder Radtouren im Eichsfeld, Paare auf der Suche nach einer privaten Auszeit (Private Spa) sowie Erholungssuchende aus der Region, die Ruhe und Entspannung im Grünen schätzen.'
