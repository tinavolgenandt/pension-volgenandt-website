excerpt: >-
  Am 7. und 8. August 2026 standen NENA, The Sweet, Slade und T. Rex auf
  der Bühne von Burg Scharfenstein, dem Konzert-Highlight des Sommers.
intro: >-
  Im Sommer 2026 wurde Burg Scharfenstein zur Open-Air-Bühne: An zwei
  Abenden im August traten internationale Musikgrößen in der
  stimmungsvollen Kulisse der mittelalterlichen Burg auf.
content: >-
  Am Freitag, dem 7. August 2026, eröffneten The Sweet, Slade und T. Rex
  das Open-Air-Wochenende mit dem „Traumhits Summer Open Air". Ab 18:30
  Uhr erklangen die größten Hits der 70er und 80er Jahre in der
  stimmungsvollen Burgkulisse, die Platz für bis zu 15.000 Gäste bietet.

  Am Samstag, dem 8. August 2026, betrat NENA mit ihrer zehnköpfigen
  Band die Bühne. In einem über zweistündigen Konzert spielte sie Hits
  aus vier Jahrzehnten. Die Karten waren schnell vergriffen, wegen der
  großen Nachfrage gab es noch ein zusätzliches Kontingent.

  Im Ticketpreis war ein Shuttle-Bus ab Leinefelde enthalten, da es an
  der Burg selbst keine Parkplätze gibt. Auch bei künftigen Konzerten
  auf der Burg liegt unsere Pension günstig: Nach dem Konzert sind Sie
  in wenigen Minuten zurück in Ihrem Zimmer und können den Abend in Ruhe
  ausklingen lassen.
