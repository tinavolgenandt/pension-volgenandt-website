# Feiern im Garten – Konfiguration des Preisrechners
#
# WICHTIG: Alle Preise sind vorläufige RICHTWERTE auf Basis einer Marktrecherche
# (Stand 2026). Vor dem Live-Gang müssen die echten Preise (v.a. Caterer,
# Versicherung) bestätigt werden. Diese Datei lässt sich ohne Code-Änderung
# anpassen – einfach Werte ändern und neu veröffentlichen.
#
# FOTOS (pro Option): Jede greifbare Option hat unten bereits einen `image`-Platz-
# halter, der auf `/img/events/…webp` zeigt. Die Dateien existieren noch nicht –
# der Konfigurator blendet ein fehlendes Bild automatisch aus. Sobald ein Foto
# vorliegt: als WebP unter genau diesem Pfad in `public/img/events/` ablegen
# (vorher optimieren, siehe CLAUDE.md), fertig – das Bild erscheint dann von
# selbst. `imageAlt` ist der Alternativtext (Barrierefreiheit/SEO); bei Bedarf
# anpassen. Pfad ändern ist erlaubt, muss aber auf die abgelegte Datei zeigen.

guestRange:
  min: 10
  max: 80
  default: 40

# Dauer der Feier in Stunden – bestimmt die Getränkepauschale (pro Person/Stunde).
partyDuration:
  min: 3
  max: 12
  default: 6

# BASISPREIS: exklusive Buchung der gesamten Pension fürs Wochenende inkl. aller
# "immer enthaltenen" Leistungen (Festzelt, Endreinigung, Koordination,
# Versicherung …). Banded nach Gästezahl, weil das enthaltene Festzelt mit der
# Größe wächst. Richtwert-Kalkulation pro Stufe:
#   Fixkern = Zimmerblock ~860 + Versicherung ~130 (Platzhalter) +
#             Organisationspauschale ~800 + Endreinigung ~500 = ~2.290 €
#   + Festzelt: ≤20 +500, ≤40 +1.000, ≤60 +1.500, ≤80 +2.200
basePackage:
  label: Basispreis – Exklusives Festwochenende
  description: >-
    Das gesamte Grundstück gehört für ein ganzes Wochenende (Fr–So, 2 Nächte) Ihnen.
    Wir kümmern uns um die komplette Organisation und sind während Ihrer Feier für
    Sie da. Im Basispreis ist bereits alles Folgende enthalten:
  guestBands:
    - maxGuests: 20
      price: 2790
    - maxGuests: 40
      price: 3290
    - maxGuests: 60
      price: 3790
    - maxGuests: 80
      price: 4490
  includes:
    - >-
      Exklusive Buchung der gesamten Pension fürs Wochenende: alle 6 Zimmer &
      Ferienwohnungen für bis zu 23 Übernachtungsgäste in Zimmern und auf
      Schlafcouches. Weitere Gäste können im Garten zelten oder mit dem
      Wohnmobil übernachten
    - 'Persönliche Eventplanung, Organisation und Koordination: Wir sind für Sie da'
    - Festzelt mit schließbaren Seitenwänden und Beleuchtung (Ihr Schlechtwetter-Plan), passend zur Gästezahl
    - Bestuhlung für alle Gäste
    - Professionelle Endreinigung nach der Feier
    - Stromversorgung für die Musik direkt aus dem Haus
    - Garage als Catering-Küche & Sanitäranlagen über die gebuchten Zimmer

# Catering läuft IMMER über unseren Partner-Caterer (kein hauseigenes Catering).
# Preis pro Person als Kundenpreis – ein Aufschlag von ~15% auf den Caterer-Preis
# ist bereits enthalten (Caterer-Richtwert: ~39/59/89 €).
cateringTiers:
  - id: rustikal
    label: Rustikales Buffet
    image: /img/events/catering-rustikal.webp
    imageAlt: Rustikales Buffet mit regionalen, saisonalen Gerichten
    description: >-
      Herzhaftes Buffet unseres Partner-Caterers mit regionalen, saisonalen
      Gerichten, unkompliziert und reichhaltig. Ideal für entspannte Familienfeiern.
    pricePerPerson: 45
  - id: klassisch
    label: Klassisches Festbuffet
    image: /img/events/catering-klassisch.webp
    imageAlt: Reich gedecktes klassisches Festbuffet
    description: >-
      Vielfältiges Buffet mit warmen und kalten Speisen, Salaten und Dessert.
      Der beliebte Klassiker unseres Partner-Caterers für Hochzeiten und große Feste.
    pricePerPerson: 69
  - id: premium
    label: Premium-Menü am Platz
    image: /img/events/catering-premium.webp
    imageAlt: Serviertes Premium-Menü am festlich gedeckten Tisch
    description: >-
      Mehrgängiges, serviertes Menü mit Service am Tisch: die festlichste und
      eleganteste Variante unseres Partner-Caterers für besondere Anlässe.
    pricePerPerson: 105

# Getränke laufen immer über uns: Selbstbedienung oder mit Service. Preis pro
# Person PRO STUNDE – hängt von der Feierdauer ab. (Markt 2026: ~25–55 € pp für
# ~6 h, ~6 € pp je weiterer Stunde → ~6 € self / ~9 € mit Service je Person/Stunde.)
drinkOptions:
  - id: selbstbedienung
    label: Getränkepauschale – Selbstbedienung
    image: /img/events/getraenke-selbstbedienung.webp
    imageAlt: Getränkestation zur Selbstbedienung
    description: >-
      Getränkestation mit Auswahl an Softdrinks, Bier und Wein; Ihre Gäste bedienen
      sich selbst. Abgerechnet pro Person und Stunde.
    pricePerPersonPerHour: 6
  - id: service
    label: Getränkepauschale – mit Service
    image: /img/events/getraenke-service.webp
    imageAlt: Getränkeservice am Tisch und an der Bar
    description: >-
      Getränke werden von unserem Personal am Tisch und an der Bar serviert.
      Abgerechnet pro Person und Stunde.
    pricePerPersonPerHour: 9

# Freie Trauung: Zeremonie im Garten mit professionellem Trauredner. Fester Preis
# inkl. Vermittlung. (Markt 2026: Trauredner ~800–1.500 €.) Platzhalter-Richtwert.
ceremonyOptions:
  - id: keine
    label: Keine Trauung vor Ort
    description: Sie feiern bei uns, die Trauung findet woanders statt (Standesamt/Kirche).
    detail: >-
      Wählen Sie diese Option, wenn Sie standesamtlich oder kirchlich an einem
      anderen Ort heiraten und bei uns "nur" feiern. Für alle anderen Anlässe
      (Geburtstag, Jubiläum …) bleibt diese Option einfach ausgewählt.
    price: 0
  - id: freie_trauung
    label: Freie Trauung im Garten
    image: /img/events/trauung-freie-trauung.webp
    imageAlt: Freie Trauzeremonie im Garten
    description: >-
      Persönliche, freie Trauzeremonie unter freiem Himmel mit einem professionellen
      Trauredner, individuell auf Ihre Geschichte abgestimmt.
    detail: >-
      Sie heiraten direkt bei uns im Garten: ein erfahrener freier Trauredner
      gestaltet Ihre Zeremonie ganz persönlich. Wir richten den Traubereich her,
      sodass Trauung und Feier zu einem stimmungsvollen Tag an einem Ort werden, ohne
      Fahrt dazwischen. Enthält Vorgespräch, persönliche Rede und Zeremonie.
    price: 1190

# Fotograf / Video: keine / Fotoreportage / Foto + Video. Fester Preis inkl.
# Vermittlung. (Markt 2026: Hochzeitsfotograf ~1.200–2.000 €, Video zusätzlich.)
photographyOptions:
  - id: keine
    label: Kein Fotograf
    description: Sie bringen Ihren eigenen Fotografen mit oder benötigen keinen.
    detail: Sie organisieren die Fotos selbst. Diese Position bleibt bei 0 €.
    price: 0
  - id: fotograf
    label: Fotograf – Reportage
    image: /img/events/foto-fotograf.webp
    imageAlt: Hochzeitsfotograf hält einen Moment der Feier fest
    description: >-
      Professionelle Foto-Reportage Ihres Tages: natürliche Momentaufnahmen und
      Gruppenbilder, als bearbeitete Bildergalerie zum Download.
    detail: >-
      Ein erfahrener Fotograf begleitet Ihre Feier und hält die schönsten Momente
      fest, vom Empfang bis zum Abend. Sie erhalten die bearbeiteten Bilder digital.
      Ein Klassiker, den fast alle Hochzeitspaare wählen.
    price: 1490
  - id: foto_video
    label: Foto + Video
    image: /img/events/foto-video.webp
    imageAlt: Foto- und Videoteam im Einsatz auf der Feier
    description: >-
      Foto-Reportage plus filmischer Zusammenschnitt Ihres Tages als Erinnerungsvideo.
    detail: >-
      Zusätzlich zur Fotoreportage entsteht ein professioneller Film Ihres Tages:
      ein bewegendes Andenken, das Sie immer wieder ansehen können. Ideal für
      Hochzeiten und große Jubiläen.
    price: 2290

# Musik: keine / nur Anlage (eigene Playlist) / kompletter DJ. Fester Preis inkl.
