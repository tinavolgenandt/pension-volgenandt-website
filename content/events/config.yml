disclaimer: >-
  Alle Preise sind unverbindliche Richtwerte und dienen der ersten Orientierung.
  Ein Wochenend-Fest setzt die exklusive Buchung der gesamten Pension für das
  Wochenende voraus (im Basispreis enthalten). Das Catering läuft über unseren
  Partner-Caterer. Der finale Preis hängt von Ihren individuellen Wünschen, der
  Gästezahl und der Dauer Ihrer Feier ab. Sie erhalten von uns immer ein
  persönliches, unverbindliches Angebot.
