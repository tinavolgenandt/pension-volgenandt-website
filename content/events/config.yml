disclaimer: >-
  Alle Preise sind unverbindlich und dienen der ersten Orientierung. Positionen
  mit dem Hinweis „Preis im Angebot“ sind nicht in der Summe enthalten. Ein
  Wochenend-Fest setzt die exklusive Buchung der gesamten Pension für das
  Wochenende voraus (im Basispreis enthalten). Das Catering kommt von unseren
  Partnern. Sie erhalten von mir immer ein persönliches, unverbindliches Angebot.
