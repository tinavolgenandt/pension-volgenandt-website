# Feiern im Garten – Konfiguration des Preisrechners
#
# PREISE (Stand 2026-10-18): Der Rechner nennt nur Preise, hinter denen ein
# echtes Angebot oder unsere eigene Kalkulation steht:
#   - cateringTiers mit priceBands: echtes Angebot eines Partners (bisher nur
#     Grillverein Thalwenden, Preisübersicht 2026-08). Eingetragen sind die
#     Preise des Partners, der Rechner schlägt den Aufschlag darauf
#     (markupPercent der Stufe, sonst cateringMarkupPercent). Der Partner
#     sieht in seiner Mail nur seinen eigenen Preis.
#   - basePackage und drinkOptions: unsere eigenen Preise.
# Alles von Dritten ohne Angebot (Zelt, Fotograf, Musik, Deko, Torte, Fotobox,
# Styling, Mobiliar, Kaffee & Kuchen) steht mit `onRequest: true` und ohne
# Preis drin: Gäste können es auswählen, der Preis kommt ins persönliche
# Angebot. Liegt ein Angebot vor: `onRequest` entfernen, `price` bzw.
# `pricePerPerson` eintragen. Diese Datei lässt sich ohne Code-Änderung
# anpassen.
#
# FOTOS (pro Option): Jede greifbare Option hat unten einen `image`-Platzhalter,
# der auf `/img/events/…webp` zeigt. Der Konfigurator blendet ein fehlendes Bild
# automatisch aus. Sobald ein Foto vorliegt: als WebP unter genau diesem Pfad in
# `public/img/events/` ablegen (vorher optimieren, siehe CLAUDE.md), fertig –
# das Bild erscheint dann von selbst und wird oben im Konfigurator groß gezeigt,
# sobald die Option ausgewählt ist. `imageAlt` ist der Alternativtext
# (Barrierefreiheit/SEO); bei Bedarf anpassen. Pfad ändern ist erlaubt, muss
# aber auf die abgelegte Datei zeigen.
#
# STATUS (Stand 2026-08-12): Die meisten Optionen haben bereits ein Foto (echte
# Fotos oder KI-generiert). Noch OHNE Foto, vor Livegang per KI zu erstellen:
#   - dishwareOptions.mietgeschirr    → geschirr-mietgeschirr.webp
#   - flooringOptions.tanzflaeche     → boden-tanzflaeche.webp
#   - flooringOptions.komplett        → boden-komplett.webp
#   - decorationOptions.schlicht      → deko-schlicht.webp
#   - decorationOptions.klassisch     → deko-klassisch.webp
#   - decorationOptions.premium       → deko-premium.webp
#   - cakeOptions.torte               → torte-festtorte.webp
#   - cakeOptions.torte_sweet         → torte-sweet-table.webp
#   - photoboothOptions.fotobox       → fotobox.webp
#   - stylingOptions.braut            → styling-braut.webp
#   - stylingOptions.braut_partner    → styling-braut-partner.webp

guestRange:
  min: 10
  max: 200
  default: 40

# Beginn der Feier (volle Stunde). Zusammen mit der Dauer ergibt sich daraus,
# welche Mahlzeiten in die Feier fallen (Kaffee & Kuchen, Abendessen …).
startTime:
  min: 10
  max: 20
  default: 14

# Dauer der Feier in Stunden – bestimmt die Getränkepauschale (pro Person/Stunde).
partyDuration:
  min: 3
  max: 12
  default: 6

# BASISPREIS: exklusive Buchung der gesamten Pension fürs Wochenende inkl. aller
# "immer enthaltenen" Leistungen. Das Festzelt ist NICHT enthalten (eigener
# Schritt, Preis im Angebot). Kalkulation (Tina, 18.10.2026):
#   Zimmerblock 1.156 € = alle Einheiten voll ausgebucht, 2 Nächte, jeweils der
#     Preis bei voller Belegung: Balkonzimmer 58, Einzelzimmer 50, Emils
#     Kuhwiese 83, Rosengarten 68, Schöne Aussicht 146, Wohlfühl-Appartement
#     75, Libellenruh 98 = 578 €/Nacht (Stand content/rooms/*.yml)
#   + Zimmer-Zuschlag 500 € pauschal, damit Aufbettungen (Schlafcouches,
#     Zustellbetten) nicht extra berechnet werden müssen (Tina, 18.10.2026)
#   + Versicherung 130 (Platzhalter) + Endreinigung 500
#   + Aufwandspauschale nach Gästezahl: 1.000 / 2.000 / 3.000 / 4.000 / 5.000 €
#   = 2.286 € + Aufwandspauschale
# Ändern sich Zimmerpreise, den Zimmerblock hier nachrechnen.
basePackage:
  label: Basispreis – Exklusives Festwochenende
  description: >-
    Das gesamte Grundstück gehört für ein ganzes Wochenende (Fr–So, 2 Nächte) Ihnen.
    Ich plane die Feier mit Ihnen und bin während der Feier vor Ort. Im Basispreis
    ist bereits Folgendes enthalten:
  guestBands:
    - maxGuests: 30
      price: 3286
    - maxGuests: 60
      price: 4286
    - maxGuests: 100
      price: 5286
    - maxGuests: 150
      price: 6286
    - maxGuests: 200
      price: 7286
  includes:
    - >-
      Exklusive Buchung der gesamten Pension fürs Wochenende: alle Zimmer und
      Ferienwohnungen für bis zu 28 Übernachtungsgäste in Betten und auf
      Schlafcouches
    - 'Persönliche Planung und Koordination durch Tina Volgenandt'
    - Endreinigung nach der Feier
    - Stromversorgung für die Musik direkt aus dem Haus
    - Garage als Catering-Küche
    - Zugang zu unserer Planungs-App

# Catering läuft IMMER über einen unserer Partner (kein hauseigenes Catering).
# Jede Stufe nennt ihren Partner. `partner` bestimmt, an wen die Anfrage geht:
# send-mail.php leitet nur an Partner in $partnerEmails weiter (bisher nur
# grillverein-thalwenden), alle anderen Anfragen landen nur bei events@.
# Stufen mit priceBands: Preis des Partners + markupPercent der Stufe (fehlt er,
# gilt cateringMarkupPercent). Stufen ohne Angebot: onRequest: true.
# Weiterer Partner: Stufen mit eigenem `partner` anhängen, fertig.
#
# Grillverein Thalwenden: ECHTES Angebot (Preisübersicht Stand 2026-08), 4
# Genusswelten, Preis pro Person sinkt mit der Gästezahl (Grillservice inkl.
# Personal; 2 Mitarbeiter bis 50 Gäste inklusive; Getränke nicht enthalten).
# priceBands = Preise des Grillvereins OHNE unseren Aufschlag.
#
# Anja kocht (Anja Randau, Witzenhausen): liefert wegen der Entfernung (60 km)
# erst ab 80 Gästen (Mail vom 23.07.2026). Noch kein Preisangebot.
cateringMarkupPercent: 10
cateringTiers:
  - id: classic
    partner: grillverein-thalwenden
    partnerName: Grillverein Thalwenden
    markupPercent: 10
    label: Classic – Der Klassiker
    image: /img/events/partner-grillverein-steak.webp
    imageAlt: Steaks und Bratwurst brutzeln auf dem Grill des Grillverein Thalwenden
    description: >-
      Bratwurst, Steak, Hähnchen, Feta, Gemüse und Grillbrot, dazu Salatauswahl
      sowie Dips & Saucen.
    priceBands:
      - maxGuests: 20
        pricePerPerson: 49.9
      - maxGuests: 50
        pricePerPerson: 34.9
      - maxGuests: 75
        pricePerPerson: 28.9
      - maxGuests: 999
        pricePerPerson: 24.9
  - id: signature
    partner: grillverein-thalwenden
    partnerName: Grillverein Thalwenden
    markupPercent: 10
    label: Signature – Unsere besondere Auswahl
    image: /img/events/partner-grillverein-grillplatte.webp
    imageAlt: Große Grillplatte mit Fisch, Spießen, Bratwurst und Burgern
    description: >-
      Rinderbratwurst, Lamm, Spareribs, Schweinefilet und Lachs, dazu erweiterte
      Salatauswahl, Grillkäse sowie Dips & Saucen.
    priceBands:
      - maxGuests: 20
        pricePerPerson: 59.9
      - maxGuests: 50
        pricePerPerson: 44.9
      - maxGuests: 75
        pricePerPerson: 38.9
      - maxGuests: 999
        pricePerPerson: 34.9
  - id: prestige
    partner: grillverein-thalwenden
    partnerName: Grillverein Thalwenden
    markupPercent: 10
    label: Prestige – Premium vom Grill
    image: /img/events/partner-grillverein-team.webp
    imageAlt: Team des Grillverein Thalwenden mit Grillstand im Garten
    description: >-
      Rinderfilet, Roastbeef, Lachs, Ente und Lammkotelett, dazu Premium-Beilagen,
      Grillkäse und Dessert.
    priceBands:
      - maxGuests: 20
        pricePerPerson: 69.9
      - maxGuests: 50
        pricePerPerson: 54.9
      - maxGuests: 75
        pricePerPerson: 48.9
      - maxGuests: 999
        pricePerPerson: 44.9
  - id: elite
    partner: grillverein-thalwenden
    partnerName: Grillverein Thalwenden
    markupPercent: 10
    label: Élite – Das außergewöhnliche Grillerlebnis
    image: /img/events/partner-grillverein-detail.webp
    imageAlt: Grillstation des Grillverein Thalwenden mit Gemüsespießen und Beilagen
    description: >-
      Rinderfilet, Rib-Eye, T-Bone, Tomahawk, Hirsch, Wild und Thunfisch:
      individuelle Premium-Auswahl mit hochwertigen Beilagen und Dessert.
    priceBands:
      - maxGuests: 20
        pricePerPerson: 84.9
      - maxGuests: 50
        pricePerPerson: 69.9
      - maxGuests: 75
        pricePerPerson: 59.9
      - maxGuests: 999
        pricePerPerson: 54.9

  - id: anja-kocht
    partner: anja-kocht
    partnerName: Anja kocht, Witzenhausen
    partnerUrl: https://www.anjakocht.de/
    label: Regionale Küche für große Feiern
    description: >-
      Partyservice Anja kocht aus Witzenhausen mit regionaler, frischer Küche.
      Für Feiern ab 80 Gästen. Was auf den Tisch kommt, stimmen wir gemeinsam
      mit Ihnen ab.
    minGuests: 80
    onRequest: true

# Getränke laufen immer über uns: Selbstbedienung, mit Service oder auf
# Kommission (nach Verbrauch, Preis im Angebot). Pauschalen pro Person PRO
# STUNDE – hängt von der Feierdauer ab. (Markt 2026: ~25–55 € pp für ~6 h,
# ~6 € pp je weiterer Stunde → ~6 € self / ~9 € mit Service je Person/Stunde.)
drinkOptions:
  - id: selbstbedienung
    label: Getränkepauschale – Selbstbedienung
    image: /img/events/getraenke-selbstbedienung.webp
    imageAlt: Getränkestation zur Selbstbedienung
    description: >-
      Getränkestation mit Auswahl an Softdrinks, Bier und Wein; Ihre Gäste bedienen
      sich selbst. Abgerechnet pro Person und Stunde.
    pricePerPersonPerHour: 6
  - id: service
    label: Getränkepauschale – mit Service
    image: /img/events/getraenke-service.webp
    imageAlt: Getränkeservice am Tisch und an der Bar
    description: >-
      Getränke werden am Tisch und an der Bar serviert.
      Abgerechnet pro Person und Stunde.
    pricePerPersonPerHour: 9
  - id: kommission
    label: Getränke auf Kommission
    description: >-
      Wir stellen die Getränke bereit, berechnet wird nur, was Ihre Gäste
      trinken. Ungeöffnete Flaschen nehmen wir zurück.
    onRequest: true

# Festzelt: nicht im Basispreis. Wir empfehlen es als Schlechtwetter-Plan für
# jede Feier, deshalb ist es vorausgewählt. Noch kein Angebot → onRequest.
tentOptions:
  - id: festzelt
    partnerName: Zeltverleih Adler
    partnerUrl: https://zeltverleih-in.de/
    label: Festzelt mit Seitenwänden (empfohlen)
    description: >-
      Zelt mit schließbaren Seitenwänden und Beleuchtung, passend zur Gästezahl.
      Wir empfehlen, es immer einzuplanen. So hat jeder Gast einen trockenen
      Platz, falls es regnet.
    onRequest: true
  - id: ohne
    label: Ohne Festzelt
    description: >-
      Sie feiern unter freiem Himmel. Bei Regen gibt es dann keinen geschützten
      Platz für alle Gäste.
    price: 0

# Kaffee & Kuchen: wird im Rechner nur gezeigt, wenn die Feier in den
