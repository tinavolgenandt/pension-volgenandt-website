    price: 290
  - id: dj
    label: DJ komplett
    image: /img/events/musik-dj.webp
    imageAlt: DJ sorgt auf der Feier für Stimmung
    description: >-
      Professioneller DJ mit kompletter Anlage für die Abendgestaltung, inkl.
