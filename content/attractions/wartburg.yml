shortDescription: 'UNESCO-Weltkulturerbe – hier übersetzte Luther das Neue Testament'
intro: >-
  Die Wartburg bei Eisenach gehört zu den bekanntesten Burgen
  Deutschlands und ist seit 1999 UNESCO-Welterbe. Hier übersetzte
  Martin Luther 1521/22 das Neue Testament ins Deutsche. Mit der
  Eisenacher Altstadt und der Drachenschlucht wird daraus ein ganzer
  Ausflugstag.
content: >-
  Die Wartburg liegt etwa 55 Kilometer von unserer Pension entfernt
  auf einem Felsen über Eisenach. Der Sage nach soll Graf Ludwig der
  Springer im Jahr 1067 beim Anblick des Berges gerufen haben: „Wart,
  Berg, du sollst mir eine Burg werden!“ Daher hat die Burg ihren
  Namen.


  Das Herz der Anlage ist der Palas aus dem 12. Jahrhundert. Er gilt
  als einer der am besten erhaltenen romanischen Profanbauten
  nördlich der Alpen. Drinnen sehen Sie den Sängersaal, in dem der
  Sage nach um 1206 der Sängerkrieg stattfand. Richard Wagner machte
  daraus seine Oper „Tannhäuser“. Die Elisabethkemenate ist ganz mit
  Glasmosaiken ausgekleidet. Sie erzählen vom Leben der Heiligen
  Elisabeth, die als junge Landgräfin auf der Wartburg lebte.


  Martin Luther versteckte sich 1521 nach dem Reichstag zu Worms zehn
  Monate auf der Burg, als „Junker Jörg“ mit Bart und ohne
  Mönchskutte. In dieser Zeit übersetzte er das Neue Testament aus dem
  Griechischen ins Deutsche. Seine schlichte Stube können Sie bis
  heute besichtigen. 1817 trafen sich hier rund 500 Studenten zum
  Wartburgfest und forderten ein geeintes Deutschland. Die Farben
  Schwarz, Rot und Gold gehen auf diese Bewegung zurück.


  Vom Südturm sehen Sie weit über den Thüringer Wald. Der Burghof ist
  frei zugänglich. Für das Museum und die historischen Räume brauchen
  Sie eine Eintrittskarte, die Räume sehen Sie bei einer Führung.


  Nach dem Besuch lohnt sich der Weg hinunter in die Eisenacher
  Altstadt. Am Markt steht die Georgenkirche, in der Johann Sebastian
  Bach 1685 getauft wurde. Wenige Gehminuten entfernt liegt das
  Bachhaus, ein Museum über sein Leben und seine Musik. Im Lutherhaus
  wohnte Luther als Schüler bei der Familie Cotta. Das Nikolaitor ist
  das einzige erhaltene Stadttor und stammt noch aus romanischer Zeit.
  Wer sich für Autos interessiert: In Eisenach wurde der Wartburg
  gebaut, die Automobile Welt Eisenach zeigt die Geschichte des
  Autobaus in der Stadt.


  Südlich der Burg beginnt die Drachenschlucht. Der Weg führt durch
  eine schmale Klamm im Thüringer Wald. An der engsten Stelle ist sie
  kaum breiter als ein Meter, die bemoosten Felswände ragen links und
  rechts mehrere Meter hoch. Gelaufen wird teils auf Gitterrosten
  direkt über dem Bach. Den Einstieg finden Sie am Wanderparkplatz im
  Mariental. Für die Schlucht hin und zurück sollten Sie ein bis zwei
  Stunden einplanen. Wer gut zu Fuß ist, wandert weiter bis zur Hohen
  Sonne am Rennsteig oder auf Waldwegen bis hinauf zur Wartburg.
hostTip: >-
  Planen Sie den Besuch unter der Woche ein, am Wochenende kann es auf
  der Burg sehr voll werden. Für die Drachenschlucht brauchen Sie feste
  Schuhe, der Weg ist auch im Sommer oft nass und rutschig. Unser
  Vorschlag für den Tag: vormittags auf die Wartburg, mittags in die
  Altstadt, nachmittags in die Schlucht.
bestTimeToVisit: 'Mai bis Oktober, unter der Woche weniger Besucher'
