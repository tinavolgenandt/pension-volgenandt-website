intro: >-
  The European Bread Museum in Ebergotzen tells the story of bread
  on a sprawling historic farmstead, from the Stone Age to the
  present day. With a windmill, herb garden and engaging exhibitions,
  it makes a great outing for the whole family.
content: >-
  Set in the green countryside near Gottingen, not far from the
  Eichsfeld region, the European Bread Museum Ebergotzen occupies
  an old farmstead with characteristic slate buildings. Everything
  here revolves around humanity's oldest cultural foodstuff.


  Across several exhibition buildings, the cultural history of bread
  comes to life on over 1,500 square metres: from harvesting grain
  to milling in the historic windmill to baking in an old brick oven.
  Authentic exhibits, vintage kitchen utensils, scales and tools bring
  bygone eras back to life.


  The expansive outdoor grounds invite you to stroll: a functioning
  windmill, old agricultural machinery, a historic carriage, and a
  lush herb garden where plants related to bread-making thrive.
  For children there are hands-on activities, and baking demonstrations
  are often held on weekends.


  The museum is located right on the Leinepfad trail, so a visit
  can easily be combined with a cycling tour or a walk along the river.
hostTip: >-
  Allow at least two hours. The outdoor grounds are more extensive
  than you might expect. If possible, visit on a weekend when baking
  demonstrations are often held and freshly baked bread can be tasted.
bestTimeToVisit: 'April to October'
