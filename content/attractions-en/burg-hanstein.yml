intro: >-
  The Hanstein Castle ruins near Bornhagen rank among the largest and
  most impressive castle ruins in Central Germany. From the mighty
  walls you can enjoy a sweeping panoramic view over the Werra
  Valley and the Eichsfeld.
content: >-
  Just 40 kilometres from our guesthouse, the Hanstein Castle ruins
  rise on a mountain spur above the village of Bornhagen. Built in the
  13th century, the castle was once the seat of the Lords of Hanstein
  and commanded the trade route through the Werra Valley.


  The imposing ruins with walls up to 20 metres high, the keep and
  the preserved vaulted cellars still convey a vivid impression of the
  former grandeur of the complex. The climb to the keep is rewarded
  with a breathtaking panoramic view.


  The view southward into the Werra Valley and towards the Hoher
  Meissner is particularly striking. On clear days the view extends
  as far as the Brocken in the Harz Mountains. It is no wonder that
  Hanstein Castle is considered one of the finest viewpoints in the
  Eichsfeld.


  Well-marked hiking trails around the castle invite you to explore
  the surroundings. The path to nearby Ludwigstein Castle on the
  Hessian side is especially recommended.
hostTip: >-
  Visit the castle on a clear day for the best panoramic views. In
  summer, regular events and medieval festivals are held at the
  castle. Ask us about upcoming dates.
bestTimeToVisit: 'Spring to autumn in clear weather'
