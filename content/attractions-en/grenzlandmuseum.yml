shortDescription: 'The history of German division at the original border crossing'
intro: >-
  The Eichsfeld Border Museum in Teistungen is located at the former
  border crossing between East and West. The exhibition and the 6 km
  Border Trail with original border installations bring the German-German
  division to life.
content: >-
  Just 16 kilometres from our guesthouse stands the Border Museum at
  the former Duderstadt-Worbis border crossing, which was opened for
  local cross-border traffic in 1973. The multimedia exhibition tells
  the stories of escape, displacement and everyday life in the border
  zone up until the opening in 1989.


  The centrepiece is the Border Trail – a 6-kilometre circular route
  with 24 stations and original border installations: watchtowers,
  signal fences, vehicle barriers and an accessible observation
  bunker. The former death strip is now part of the Green Belt, a
  unique strip of nature along the former border.


  Guided tours are offered in German, English, French and Spanish.
  On Saturdays at 2 pm there is a public guided tour along the
  Border Trail.
hostTip: >-
  Allow at least 3 hours – the exhibition and the Border Trail
  together are particularly moving. Sturdy footwear is recommended
  for the outdoor trail.
bestTimeToVisit: 'Year-round, dry weather recommended for the Border Trail'
