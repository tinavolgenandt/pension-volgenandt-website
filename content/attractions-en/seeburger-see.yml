shortDescription: '"The Eye of the Eichsfeld" – swimming, boating and nature'
intro: >-
  Seeburger See is affectionately known as "the Eye of the Eichsfeld".
  At around 88 hectares it is the largest natural lake in southern
  Lower Saxony and a popular destination for families and nature
  lovers.
content: >-
  Just around 25 kilometres from our guesthouse lies the Seeburger
  See in the Lower Saxon part of the Eichsfeld. The natural swimming
  area is open from April to October and offers a sandy beach for
  swimming and relaxing. Rowing boats and pedal boats can be hired
  on site.


  The lake has been a nature reserve since 1976 and is an important
  habitat for waterfowl. A visit is especially rewarding in spring
  and autumn for birdwatching. A circular path along the shore is
  ideal for leisurely walks and cycling tours.


  Three restaurants right by the lake provide refreshments. Those
  wishing to stay longer will also find a campsite and a mini-golf
  course.
hostTip: >-
  On a warm summer day it is ideal for swimming. Take a pedal boat
  and explore the lake from the water – especially beautiful in the
  evening sun.
bestTimeToVisit: 'May to September for swimming, spring and autumn for birdwatching'
