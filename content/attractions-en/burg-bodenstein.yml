intro: >-
  Bodenstein Castle sits majestically on a mountain spur of the Ohmgebirge
  range and is one of the best-preserved medieval castles in Thuringia.
  A visit is worthwhile for history enthusiasts and those who enjoy fine
  food alike.
content: >-
  About 9 kilometres from our guesthouse, Bodenstein Castle rises on a
  rocky spur above the valley. The over 900-year-old hilltop castle
  impresses with its mighty keep, Romanesque chapel and spacious
  inner courtyard.


  Today the castle serves as a family and conference centre of the
  Protestant Church in Central Germany. Visitors can tour the historic
  rooms, visit the castle chapel and enjoy the breathtaking panoramic
  views over the Eichsfeld.


  The castle cafe invites you to linger with homemade cakes and regional
  specialities. The terrace with its view into the valley is especially
  recommended, a wonderful spot for a coffee break after your tour.


  Several hiking trails lead through the wooded hillsides around the
  castle. The combination of nature, history and gastronomy makes
  Bodenstein Castle a perfect day trip.
hostTip: >-
  Combine your visit with a hike along the Castle Trail. The route
  from Bodenstein Castle to Hanstein Castle is particularly scenic
  and leads through beautiful deciduous forests.
bestTimeToVisit: 'Year-round, especially lovely in autumn'
