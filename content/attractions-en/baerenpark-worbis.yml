intro: >-
  The Alternative Bear Park Worbis is one of the most popular
  destinations near us. Bears and wolves rescued from poor keeping
  conditions live here in large, naturalistic enclosures.
content: >-
  Just 6 kilometres from our guesthouse lies the Alternative Bear
  Park in Worbis. Across an area of 4 hectares, brown bears, black
  bears and wolves live in species-appropriate enclosures.


  The park was founded as a sanctuary for bears rescued from poor
  keeping conditions and offers visitors a unique insight into the
  lives of these fascinating animals. A circular trail leads through
  the entire park, past observation points and information boards.


  For families with children there is a petting zoo and an adventure
  playground. The park restaurant serves regional cuisine to help you
  recharge.


  The bear park is actively committed to animal welfare and raises
  awareness about the issues of private wild animal keeping. A visit
  is a wonderful experience, and it supports an important cause too.
hostTip: >-
  Come early in the morning when the bears are most active. The
  trail takes about 1-2 hours. Bring sturdy footwear. The path
  leads through hilly woodland.
bestTimeToVisit: 'Spring to autumn'
