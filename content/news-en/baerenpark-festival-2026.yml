intro: >-
  The Alternative Bear Park Worbis, only 6 kilometres from our
  guesthouse, invites visitors to the Wir.Sind.Tier. Festival on
  June 27 and 28, 2026. The open-air charity festival combines live
  music with animal welfare and is an experience for the whole family.
content: >-
  The Wir.Sind.Tier. Festival has become a fixture on the Eichsfeld
  calendar in recent years. Over two days, visitors can look forward
  to a varied programme: live music spanning different genres,
  interactive stands from animal welfare organisations, food trucks,
  and an extensive children's programme.

  Admission includes access to the entire Bear Park, where bears,
  wolves, and other animals rescued from poor conditions have found
  a new home. This way you can combine a festival visit and a park
  tour in a single day.

  New at the Bear Park is the Bear Mobile: an electric vehicle that
  offers guided tours through the park. With space for up to five
  people, it is a welcome addition especially for guests with
  limited mobility.

  From our guesthouse you can reach the Bear Park in just a few
  minutes. Enjoy the festival during the day and the tranquillity
  of our garden in the evening.
