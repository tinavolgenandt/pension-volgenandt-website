excerpt: >-
  Since 2025, a new 9.4 km cycle path connects the Unstrut Cycle Route
  with the Leine-Heide Cycle Route – closing a gap in the cycle network.
intro: >-
  Good news for cyclists: since spring 2025, there is a new connecting
  cycle path between the Unstrut Cycle Route and the Leine-Heide Cycle
  Route. The 9.4-kilometre route closes an important gap in the
  Eichsfeld cycle network.
content: >-
  The new cycle path runs from the Unstrut spring near Kefferhausen
  (Dingelstadt) via Kreuzebra and Heuthen to Geisleden. On the
  well-maintained route you cycle safely and comfortably through
  the gentle hills of the Eichsfeld.

  Thuringia's Infrastructure Minister emphasised at the opening that
  the cycle path not only strengthens cycling tourism but also makes
  everyday cycling in the region safer. For our guests this means:
  even more options for day trips by bike.

  Combined with the existing Leine Cycle Route, which passes directly
  by Breitenbach, there are now extensive circular tours through the
  entire Eichsfeld. Our guesthouse is an ideal starting point – and
  after a long ride you can look forward to a good breakfast the
  next morning.
