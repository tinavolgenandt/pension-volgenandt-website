seoTitle: 'Scharfenstein Open Air 2026: NENA'
seoDescription: >-
  NENA, The Sweet, Slade and T. Rex played Scharfenstein Castle on 7 and
  8 August 2026. The castle is just 10 km from Pension Volgenandt in the
  Eichsfeld.
