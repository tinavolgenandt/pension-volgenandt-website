intro: >-
  In summer 2026, Scharfenstein Castle became an open-air stage: on two
  evenings in August, international music stars performed against the
  atmospheric backdrop of the medieval castle.
content: >-
  On Friday, 7 August 2026, The Sweet, Slade and T. Rex opened the
  open-air weekend with the "Traumhits Summer Open Air". From 6:30 pm,
  the greatest hits of the 70s and 80s rang out in the castle setting,
  which holds up to 15,000 guests.

  On Saturday, 8 August 2026, NENA took the stage with her ten-piece
  band. In a concert lasting over two hours, she played hits spanning
  four decades. Tickets sold out quickly, and extra tickets were
  released due to high demand.

  A shuttle bus from Leinefelde was included in the ticket price, as
  there is no parking at the castle itself. For future concerts at the
  castle, our guesthouse is well placed: afterwards you are back in your
  room within minutes and can end the evening in peace.
