faq:
  - question: 'Can day guests rent the barrel sauna without staying overnight?'
    answer: 'Yes! Our garden barrel sauna is open to outside visitors as well. The flat rate is €29 for 2 hours for the entire barrel sauna (not per person). Advance reservation is required so that we can preheat the sauna in good time.'
  - question: 'Is sauna use free for overnight guests of Pension Volgenandt?'
    answer: 'Yes, for all overnight guests staying at our guesthouse, access to the barrel sauna is included in the room price. Time slots for undisturbed privacy can be reserved flexibly on site or upon booking.'
  - question: 'How many people fit into the barrel sauna?'
    answer: 'The barrel sauna comfortably accommodates 2 to 4 people on two opposing wooden benches – ideal for couples, friends, or solo travellers seeking private relaxation in the garden.'
  - question: 'How is the sauna heated and what temperature is reached?'
    answer: 'The sauna is heated by an electric stove to traditional Finnish temperatures of 80 to 90 °C. On sunny days, the energy comes straight from our rooftop solar panels.'
  - question: 'How do guests cool down after a sauna session?'
    answer: 'An outdoor garden shower with cold water is available right next to the sauna. Guests can also cool off in the fresh country air and rest on loungers in our natural garden.'
  - question: 'When will the barrel sauna be open for use?'
    answer: 'Installation is scheduled for late November 2026. As soon as the exact opening date is fixed, we will post it here. Advance enquiries and reservations are already welcome by phone or email.'
  - question: 'Who is the garden barrel sauna best suited for?'
    answer: 'It is perfect for hikers and cyclists relaxing after an outdoor tour in the Eichsfeld, couples looking for a romantic private spa retreat, and local day visitors wanting a quiet sauna experience in nature.'
