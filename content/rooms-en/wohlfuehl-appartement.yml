description: >-
  The Comfort Apartment offers everything you need for a
  relaxing stay. A kettle, refrigerator and sink are
  available right in the room. The double bed
  accommodates 2 guests; an additional sofa bed is
  suitable for e.g. children. Wi-Fi, TV and an en-suite
  bathroom with shower are included as standard. The
  fully equipped shared kitchen and the terrace are
  available for all guests – we kindly ask for
  consideration of others.

