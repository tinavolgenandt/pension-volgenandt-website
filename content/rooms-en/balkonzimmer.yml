description: >-
  The Balcony Room combines a cosy atmosphere with the
  added bonus of a private balcony. Two single beds that
  can be pushed together on request, a small table, and
  an en-suite bathroom with shower await you. In the
  morning you can enjoy your coffee on the balcony while
  taking in the view of the courtyard. Wi-Fi and TV
  provide evening entertainment. The fully equipped
  shared kitchen and the terrace are available for all
  guests – we kindly ask for consideration of others.

