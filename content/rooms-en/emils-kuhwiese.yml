  terrace and an additional sofa bed – ideal for
  2 guests or small families.
description: >-
  The holiday apartment Emil's Kuhwiese offers
  everything you need for a relaxing stay. The fully
  equipped kitchen allows self-catering, while the
  terrace invites you to enjoy breakfast outdoors. The
  double bed accommodates 2 guests; an additional sofa
  bed is suitable for e.g. children, so families with
  2 adults and up to 2 children can stay here
  comfortably. Wi-Fi, TV and an en-suite bathroom
  with shower are included as standard.

