description: >-
  The Rose Garden Room owes its name to the beautiful
  view of our well-tended rose garden. Two single beds
  that can be pushed together on request, an en-suite
  bathroom with shower and tasteful country-style
  furnishings await you. Wi-Fi and TV are of course
  included. Let the scent of roses lull you to sleep.
  Our fully equipped shared kitchen and the terrace are
  available for all guests. We kindly ask for
  consideration of others.

