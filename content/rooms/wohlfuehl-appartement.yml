description: >-
  Das Wohlfühl-Appartement bietet Ihnen allen Komfort für
  einen erholsamen Aufenthalt. Im Zimmer stehen Ihnen
  ein Wasserkocher, ein Kühlschrank und eine Spüle zur
  Verfügung. Das Doppelbett bietet Platz für 2 Gäste;
  ein zusätzliches Schlafsofa eignet sich gut für bspw.
  Kinder. WLAN, Fernseher und ein eigenes Badezimmer
  mit Dusche gehören selbstverständlich dazu. Die voll
  ausgestattete Gemeinschaftsküche und die Terrasse dürfen
  gerne genutzt werden. Wir bitten dabei um
  Rücksichtnahme auf andere Gäste.

