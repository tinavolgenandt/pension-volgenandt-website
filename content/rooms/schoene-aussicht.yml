description: >-
  Die Ferienwohnung Schöne Aussicht überzeugt mit ihrem
  weiten Blick über die Hügellandschaft des Eichsfelds.
  Zwei Schlafzimmer mit je einem Doppelbett, Schlafsofa
  und eigenem Badezimmer bieten bequem Platz für 4 Gäste.
  Der großzügige Wohnbereich mit voll ausgestatteter Küche,
  einem weiteren Schlafsofa und einem dritten Badezimmer
  ermöglicht auch 6 Personen einen komfortablen Aufenthalt.
  WLAN und Fernseher sind selbstverständlich.

