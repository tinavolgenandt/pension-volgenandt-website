name: Monthly Statistics Collection

on:
  schedule:
    # 1st of each month at 07:00 UTC (08:00 CET / 09:00 CEST)
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      report_month:
        description: 'Month to report (1-12, leave empty for auto)'
        required: false
        default: ''
      report_year:
        description: 'Year to report (e.g. 2026, leave empty for auto)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Collect and send monthly statistics
        run: node scripts/collect-stats.mjs
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
          BEDS24_PROPERTY_ID: '261258'
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          SMTP_HOST: 'smtp.ionos.de'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_RECIPIENTS: 'kontakt@pension-volgenandt.de,tina.volgenandt@googlemail.com'
          LOOKER_STUDIO_URL: ${{ secrets.LOOKER_STUDIO_URL }}
          REPORT_MONTH: ${{ github.event.inputs.report_month }}
          REPORT_YEAR: ${{ github.event.inputs.report_year }}
