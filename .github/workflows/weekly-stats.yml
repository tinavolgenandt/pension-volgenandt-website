name: Weekly Statistics

on:
  schedule:
    # Every Friday at 07:00 UTC (08:00 CET / 09:00 CEST)
    # Period covered: last Friday through yesterday (Thu) — 7 complete days
    - cron: '0 7 * * 5'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Collect and send weekly statistics
        run: node scripts/weekly-stats.mjs
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
          BEDS24_PROPERTY_ID: '261258'
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SMTP_HOST: 'smtp.ionos.de'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_RECIPIENTS: 'kontakt@pension-volgenandt.de,tina.volgenandt@googlemail.com'
