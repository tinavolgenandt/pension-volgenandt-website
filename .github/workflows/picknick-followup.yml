name: Picknick Follow-up

on:
  schedule:
    # Every 30 minutes — keeps the "5 hours after pickup" promise accurate
    # to within half an hour without needing cron access on the IONOS host.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger picnic follow-up check
        # Secret via env, not pasted into the script text
        env:
          FOLLOWUP_SECRET: ${{ secrets.PICKNICK_FOLLOWUP_SECRET }}
        run: |
          curl -fsS -X POST https://api.pension-volgenandt.de/picknick-followup.php \
            -H "X-Followup-Secret: $FOLLOWUP_SECRET" \
            --retry 3 --retry-delay 5 --retry-all-errors
