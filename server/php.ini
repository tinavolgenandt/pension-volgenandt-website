; Per-directory PHP settings for the IONOS webspace.
; No -X here: it would write a full log of every mail (guest data) into the
; public web root.
sendmail_path=/usr/sbin/sendmail -t -i
display_errors=Off
log_errors=On
expose_php=Off
session.cookie_secure=1
session.cookie_httponly=1
session.use_strict_mode=1
